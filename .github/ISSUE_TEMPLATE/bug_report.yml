name: Bug report
description: Report a reproducible Codex Memories failure using synthetic data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include real memories, credentials, local paths, or private hook payloads.
  - type: input
    id: version
    attributes:
      label: Commit or release
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Platform and Python version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Include the smallest commands and synthetic fixtures that reproduce the behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected fail-closed behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
