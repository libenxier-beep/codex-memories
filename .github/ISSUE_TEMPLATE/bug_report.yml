name: Installation or recall problem
description: Help us reproduce a problem using synthetic examples.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Thanks for trying Codex Memories. Remove private memories, local paths, credentials and transcript content before posting."
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "git rev-parse --short HEAD"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, Python and Codex versions
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use a made-up example rather than your private memories.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted doctor or demo output
      render: text
